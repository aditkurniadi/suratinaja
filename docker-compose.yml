services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8000}:8080"
    expose:
      - "8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: "${APP_NAME:-SuratinAja}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:O308AMZodXAdU1Yc6QQD9ZtYIn0coNYxlF+noDl8Cro=}"
      APP_URL: "${APP_URL:-http://127.0.0.1:8000}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-43.156.64.105}"
      DB_PORT: "${DB_PORT:-20129}"
      DB_DATABASE: "${DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      GOTENBERG_URL: "${GOTENBERG_URL:-http://gotenberg:3000}"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:-admin@organisasi.id}"
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD:-PasswordKuat123!}"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    depends_on:
      gotenberg:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: "${APP_NAME:-SuratinAja}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:O308AMZodXAdU1Yc6QQD9ZtYIn0coNYxlF+noDl8Cro=}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-43.156.64.105}"
      DB_PORT: "${DB_PORT:-20129}"
      DB_DATABASE: "${DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      QUEUE_CONNECTION: database
      GOTENBERG_URL: "${GOTENBERG_URL:-http://gotenberg:3000}"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    depends_on:
      gotenberg:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: "${APP_NAME:-SuratinAja}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:O308AMZodXAdU1Yc6QQD9ZtYIn0coNYxlF+noDl8Cro=}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-43.156.64.105}"
      DB_PORT: "${DB_PORT:-20129}"
      DB_DATABASE: "${DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
    volumes:
      - suratinaja-storage:/var/www/html/storage

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"

volumes:
  suratinaja-storage:
