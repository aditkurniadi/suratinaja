services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8000}:8080"
    environment:
      APP_NAME: SuratinAja
      APP_ENV: "${DOCKER_APP_ENV:-local}"
      APP_DEBUG: "${DOCKER_APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY:-base64:O308AMZodXAdU1Yc6QQD9ZtYIn0coNYxlF+noDl8Cro=}"
      APP_URL: "${DOCKER_APP_URL:-http://127.0.0.1:8000}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-suratinaja}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      GOTENBERG_URL: "http://gotenberg:3000"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      gotenberg:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    environment:
      APP_ENV: "${DOCKER_APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:O308AMZodXAdU1Yc6QQD9ZtYIn0coNYxlF+noDl8Cro=}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-suratinaja}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      GOTENBERG_URL: "http://gotenberg:3000"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      APP_ENV: "${DOCKER_APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:O308AMZodXAdU1Yc6QQD9ZtYIn0coNYxlF+noDl8Cro=}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-suratinaja}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-suratinaja}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-suratinaja}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - suratinaja-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suratinaja-storage:
  suratinaja-mysql:
