services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_NAME: "${APP_NAME:-SuratinAja}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      GOTENBERG_URL: "http://gotenberg:3000"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:-admin@organisasi.id}"
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD:-PasswordKuat123!}"
      AUTORUN_LARAVEL_MIGRATION: "false"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    networks:
      - dokploy-network
      - suratinaja-internal
    depends_on:
      gotenberg:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3"]
    environment:
      APP_NAME: "${APP_NAME:-SuratinAja}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      QUEUE_CONNECTION: database
      GOTENBERG_URL: "http://gotenberg:3000"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    networks:
      - suratinaja-internal
    depends_on:
      gotenberg:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      APP_NAME: "${APP_NAME:-SuratinAja}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-suratinaja}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
    volumes:
      - suratinaja-storage:/var/www/html/storage
    networks:
      - suratinaja-internal

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - suratinaja-internal

volumes:
  suratinaja-storage:

networks:
  dokploy-network:
    external: true
  suratinaja-internal:
    driver: bridge
